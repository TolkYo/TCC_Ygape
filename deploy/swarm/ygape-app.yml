version: "3.8"

# Frontend publicado em https://ygape.aquacode.dev.br.
# Stack separada da API/BD para que alterações na stack `ygape` não derrubem o site.
#   docker stack deploy -c ygape-app.yml ygape-app
#
# Conteúdo servido: /opt/ygape/web (build de frontend/dist)
# Config do nginx: /opt/ygape/nginx.conf (proxy /api/ -> ygape_api:8000)

networks:
  ygape_net:
    external: true
    name: ygape_ygape_net

services:
  web:
    image: nginx:alpine
    volumes:
      - /opt/ygape/web:/usr/share/nginx/html:ro
      - /opt/ygape/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ygape_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      labels:
        - traefik.enable=true
        - traefik.swarm.network=ygape_ygape_net
        - traefik.http.routers.ygape-app.rule=Host(`ygape.aquacode.dev.br`)
        - traefik.http.routers.ygape-app.entrypoints=websecure
        - traefik.http.routers.ygape-app.tls.certresolver=le
        - traefik.http.services.ygape-app.loadbalancer.server.port=80
