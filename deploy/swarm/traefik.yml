version: "3.8"

# Edge proxy do servidor: substitui o nginx (80/443) e roteia os serviços.
# - provider swarm: descobre serviços com labels traefik.enable=true
# - provider file:  rotas estáticas (ex.: formatabnt.com.br -> formatador_web)
# - ACME (Let's Encrypt) via HTTP-01 na porta 80
#
# Deploy:  docker stack deploy -c traefik.yml traefik

networks:
  formatador_internal:
    external: true
    name: formatador_internal
  ygape_net:
    external: true
    name: ygape_ygape_net

volumes:
  traefik_acme:

services:
  traefik:
    image: traefik:v3
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=admin@formatabnt.com.br
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/hidrowize/deploy/swarm/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_acme:/acme
    networks:
      - formatador_internal
      - ygape_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
